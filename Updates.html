<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Updates - CampusHelp</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #123c69;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 35px auto;
        }

        .intro {
            text-align: center;
            margin-bottom: 30px;
        }

        .intro h2 {
            color: #123c69;
            margin-bottom: 10px;
        }

        .intro p {
            color: #666;
            line-height: 1.6;
        }

        .updates {
            display: grid;
            gap: 20px;
        }

        .update-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            border-left: 6px solid #123c69;
        }

        .update-card h3 {
            color: #123c69;
            margin-bottom: 8px;
        }

        .update-card p {
            line-height: 1.6;
            color: #444;
            margin: 8px 0;
        }

        .tag {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #e8f0f8;
            color: #123c69;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .date {
            color: #777;
            font-size: 14px;
        }

        .general {
            border-left-color: #123c69;
        }

        .safety {
            border-left-color: #b91c1c;
        }

        .safety .tag {
            background: #ffe1e1;
            color: #a00000;
        }

        .maintenance {
            border-left-color: #2563eb;
        }

        .maintenance .tag {
            background: #e0edff;
            color: #174ea6;
        }

        .event {
            border-left-color: #15803d;
        }

        .event .tag {
            background: #dcfce7;
            color: #166534;
        }

        .no-updates {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #666;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .developer {
            margin-top: 40px;
            text-align: center;
            background: #123c69;
            color: white;
            padding: 20px;
            border-radius: 12px;
        }

        .developer h3 {
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>CAMPUSHELP</h1>

    <a href="index.html">Home</a>

</header>


<div class="container">

    <div class="intro">

        <h2>📢 Campus Updates</h2>

        <p>
            Stay informed about important announcements,
            safety information, maintenance activities and
            campus events.
        </p>

    </div>


    <div id="updatesContainer" class="updates"></div>


    <div class="developer">

        <h3>Developed By</h3>

        <p>Katwesigye Nicholas</p>

        <p>BIT Student | CampusHelp Project</p>

    </div>

</div>


<footer>

    CampusHelp — Report. Connect. Get Help. Stay Safe.

    <br>

    © 2026 CampusHelp

</footer>


<script>

function getCategoryClass(category) {

    if (category === "SAFETY") {
        return "safety";
    }

    if (category === "MAINTENANCE") {
        return "maintenance";
    }

    if (category === "EVENT") {
        return "event";
    }

    return "general";
}


function getCategoryIcon(category) {

    if (category === "SAFETY") {
        return "⚠️";
    }

    if (category === "MAINTENANCE") {
        return "🔧";
    }

    if (category === "EVENT") {
        return "📅";
    }

    return "📢";
}


function loadUpdates() {

    const announcements =
        JSON.parse(
            localStorage.getItem("campusHelpAnnouncements")
        ) || [];


    const container =
        document.getElementById("updatesContainer");


    container.innerHTML = "";


    /*
       These are the original CampusHelp
       information cards.
    */

    const welcome = document.createElement("div");

    welcome.className = "update-card general";

    welcome.innerHTML = `

        <span class="tag">
            📢 GENERAL
        </span>

        <h3>
            Welcome to CampusHelp
        </h3>

        <p>
            CampusHelp is available to help students
            report campus problems, track submitted reports
            and receive important campus information.
        </p>

        <div class="date">
            CampusHelp Information
        </div>

    `;

    container.appendChild(welcome);


    /*
       Display announcements created
       by the administrator.
    */

    announcements
        .slice()
        .reverse()
        .forEach(announcement => {

            const card =
                document.createElement("div");

            const categoryClass =
                getCategoryClass(
                    announcement.category
                );

            const icon =
                getCategoryIcon(
                    announcement.category
                );


            card.className =
                "update-card " +
                categoryClass;


            card.innerHTML = `

                <span class="tag">
                    ${icon}
                    ${announcement.category}
                </span>

                <h3>
                    ${announcement.title}
                </h3>

                <p>
                    ${announcement.text}
                </p>

                <div class="date">
                    Posted on ${announcement.date}
                </div>

            `;


            container.appendChild(card);

        });

}


loadUpdates();

</script>

</body>
</html>
